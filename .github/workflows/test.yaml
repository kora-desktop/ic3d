name: 🪲 Test

on:
  # A branch is tested through its pull request; testing every push too ran it twice.
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  run-tests:
    name: Run tests
    runs-on: ubuntu-latest

    steps:
      - name: Install Task
        uses: go-task/setup-task@v1
      - uses: actions/checkout@v3
      - uses: kora-desktop/ci-actions/git-auth@v1
        with:
          client-id: ${{ vars.CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
      - run: |
          task docker:run TARGET='ci'

  crates-io:
    name: Test the crates.io build
    runs-on: ubuntu-latest

    steps:
      - name: Install Task
        uses: go-task/setup-task@v1
      - uses: actions/checkout@v3
      - uses: kora-desktop/ci-actions/git-auth@v1
        with:
          client-id: ${{ vars.CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
      - run: |
          task docker:run TARGET='test:crates-io'
